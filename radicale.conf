# RedPost — Radicale (Kalender & Kontakte). Wird nur von RedPost angesprochen (eigenes, internes Compose-Netz):
# RedPost prueft die Anmeldung (Sitzung bzw. Geraete-Passwort unter /dav) und nennt das Konto in X-Remote-User.
# owner_only: jedes Konto sieht ausschliesslich seine eigenen Kalender und Adressbuecher.
[server]
hosts = 0.0.0.0:5232
max_content_length = 20000000

[auth]
type = http_x_remote_user

[rights]
type = owner_only

[storage]
filesystem_folder = /data/collections

[web]
type = none

[logging]
level = warning
