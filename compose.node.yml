services:
  app:
    image: ghcr.io/theredstonee/redpost:latest
    restart: unless-stopped
    environment:
      NUXT_DB_URL: ${DB_URL:?Bitte DB_URL in .env setzen}
      RP_NODE_NAME: ${RP_NODE_NAME:-}
      TZ: ${TZ:-Europe/Berlin}
      RP_NODE_ROLE: ${RP_NODE_ROLE:-}
    volumes:
      - dateien:/data
    ports:
      - "${RP_BIND:-127.0.0.1}:${RP_PORT:-3000}:3000"
    stop_grace_period: 20s

volumes:
  dateien:
