services:
  app:
    volumes:
      - mailkonfig:/mailkonfig
      - maildaten:/maildaten
    environment:
      RP_MAIL: "1"
      RP_MAILKONFIG: /mailkonfig
      RP_MAILDATEN: /maildaten
      RP_MAIL_INTERN: mail
      RP_MAIL_HOST: ${RP_MAIL_HOST:?RP_MAIL_HOST fehlt in der .env}
      RP_MAIL_SIEVE_PORT: "4190"
      RP_MAIL_SELBSTSIGNIERT: ${RP_MAIL_SELBSTSIGNIERT:-1}

  mail:
    image: docker.io/mailserver/docker-mailserver:16.0.1
    hostname: ${RP_MAIL_HOST:?RP_MAIL_HOST fehlt in der .env}
    restart: unless-stopped
    ports:
      - "${RP_MAIL_BIND:-0.0.0.0}:${RP_MAIL_PORT_SMTP:-25}:25"
      - "${RP_MAIL_BIND:-0.0.0.0}:${RP_MAIL_PORT_SMTPS:-465}:465"
      - "${RP_MAIL_BIND:-0.0.0.0}:${RP_MAIL_PORT_SUBMISSION:-587}:587"
      - "${RP_MAIL_BIND:-0.0.0.0}:${RP_MAIL_PORT_IMAPS:-993}:993"
      - "${RP_MAIL_BIND:-0.0.0.0}:${RP_MAIL_PORT_SIEVE:-4190}:4190"
    volumes:
      - mailkonfig:/tmp/docker-mailserver
      - maildaten:/var/mail
      - mailstatus:/var/mail-state
      - maillogs:/var/log/mail
    environment:
      ENABLE_RSPAMD: "1"
      ENABLE_OPENDKIM: "0"
      ENABLE_OPENDMARC: "0"
      ENABLE_POLICYD_SPF: "0"
      ENABLE_AMAVIS: "0"
      ENABLE_SPAMASSASSIN: "0"
      ENABLE_CLAMAV: ${RP_MAIL_CLAMAV:-0}
      ENABLE_FAIL2BAN: "0"
      ENABLE_POP3: "0"
      ENABLE_MANAGESIEVE: "1"
      ENABLE_SRS: "1"
      SPOOF_PROTECTION: "1"
      MOVE_SPAM_TO_JUNK: "1"
      RSPAMD_LEARN: "1"
      PERMIT_DOCKER: none
      DMS_VMAIL_UID: "1000"
      DMS_VMAIL_GID: "1000"
      ONE_DIR: "1"
      POSTMASTER_ADDRESS: ${RP_MAIL_POSTMASTER:-postmaster@localhost}
      SSL_TYPE: manual
      SSL_CERT_PATH: ${RP_MAIL_CERT:-/tmp/docker-mailserver/ssl/cert.pem}
      SSL_KEY_PATH: ${RP_MAIL_KEY:-/tmp/docker-mailserver/ssl/key.pem}
      LOG_LEVEL: warn
      TZ: ${TZ:-Europe/Berlin}
    healthcheck:
      test: ["CMD-SHELL", "ss --listening --tcp | grep -q ':smtp ' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    stop_grace_period: 30s

volumes:
  mailkonfig: {}
  maildaten: {}
  mailstatus: {}
  maillogs: {}
