services:
  app:
    image: ghcr.io/theredstonee/redpost:latest
    restart: unless-stopped
    environment:
      NUXT_DB_URL: postgres://redpost:${DB_PASSWORD:?Bitte DB_PASSWORD in .env setzen}@db:5432/redpost
      TZ: ${TZ:-Europe/Berlin}
      RP_RESET_2FA: ${RP_RESET_2FA:-}
      RP_LANG: ${RP_LANG:-de}
      RP_NODE_NAME: ${RP_NODE_NAME:-}
      RP_RADICALE: http://radicale:5232
      RP_TUNNEL_METRICS: ${RP_TUNNEL_METRICS:-cloudflared:2000}
    volumes:
      - daten:/data
    depends_on:
      db:
        condition: service_healthy
      radicale:
        condition: service_started
    expose: ["3000"]
    stop_grace_period: 20s
    networks: [default, kalender]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: redpost
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: redpost
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redpost -d redpost"]
      interval: 5s
      timeout: 3s
      retries: 20

  radicale:
    image: tomsquest/docker-radicale:3.9.0.0
    restart: unless-stopped
    environment:
      TAKE_FILE_OWNERSHIP: "false"
    volumes:
      - radicale:/data
      - ./radicale.conf:/config/config:ro
    expose: ["5232"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID", "CHOWN", "KILL"]
    networks: [kalender]

  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      TUNNEL_TOKEN: ${RP_TUNNEL_TOKEN:-}
    depends_on:
      - app

volumes:
  db:
  daten:
  radicale:

networks:
  default:
  kalender:
    internal: true
