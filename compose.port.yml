# RedPost — ohne eigenen Caddy: die App hoert auf EINEM Port, dein vorhandener Webserver
# (nginx, Apache, Plesk …) leitet die Domain dorthin weiter und macht HTTPS.
# Aktiv, wenn in .env steht:  COMPOSE_FILE=docker-compose.yml:compose.port.yml
#
#   RP_PORT=8080            der Port (install.sh sucht einen freien)
#   RP_BIND=127.0.0.1       nur von diesem Server aus erreichbar (Standard); 0.0.0.0 = von ueberall
#   RP_PROXY_DOMAIN=…       Domain, unter der dein Webserver RedPost ausliefert (optional)
#
# Dein Webserver muss die Header Host, X-Forwarded-Proto und X-Forwarded-For setzen — die
# Vorlage dafuer zeigt install.sh und RedPost unter Einstellungen → Verbindung.
services:
  app:
    ports:
      - "${RP_BIND:-127.0.0.1}:${RP_PORT:?Bitte RP_PORT in .env setzen}:3000"
    environment:
      RP_PORT: ${RP_PORT}
      RP_BIND: ${RP_BIND:-127.0.0.1}
      RP_PROXY_DOMAIN: ${RP_PROXY_DOMAIN:-}
