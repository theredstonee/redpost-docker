services:
  mail:
    volumes:
      - caddy_data:/rp-caddy:ro
    environment:
      SSL_TYPE: manual
      SSL_CERT_PATH: /rp-caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${RP_MAIL_HOST}/${RP_MAIL_HOST}.crt
      SSL_KEY_PATH: /rp-caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/${RP_MAIL_HOST}/${RP_MAIL_HOST}.key
